# Day-one gate for ecom-project. No Terraform yet. Both jobs must go green
# before any module is written. If red, the printed sub/aud is the diagnostic —
# compare it character-for-character against ci_sub/cd_sub in bootstrap/projects/ecom/main.tf.
name: oidc-smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # sub claim here should match ci_sub: repo:CyberBass051@*/<repo>@*:pull_request
  ci-role:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Show the sub claim GitHub is actually sending
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref}'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws sts get-caller-identity

  # sub claim here should match cd_sub: repo:CyberBass051@*/<repo>@*:ref:refs/heads/main
  cd-role:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Show the sub claim GitHub is actually sending
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref}'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - run: aws sts get-caller-identity
